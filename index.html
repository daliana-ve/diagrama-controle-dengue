
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diagrama de Controle da Dengue - Regional de Colatina</title>

    <!-- Biblioteca dos gráficos -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <!-- Biblioteca para ler o CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background: #ffffff;
            padding: 25px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            color: #666;
            margin-top: 8px;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 20px;
        }

        .filtro {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .filtro label {
            font-weight: bold;
            margin-right: 10px;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            min-width: 280px;
        }

        .grafico {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        #grafico {
            width: 100%;
            height: 600px;
        }

    </style>

</head>

<body>

<header>

    <h1>Diagrama de Controle da Dengue</h1>
    <p id="atualizacao" style="font-weight: bold;"></p>
    <h3 style="margin-bottom: 5px;">
    Cenário consolidado da Regional de Saúde
</h3>
    <div id="kpiRegionalTotal" style="
    display: inline-block;
    padding: 12px 20px;
    margin: 10px 0 20px 0;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
">
    <div style="font-size: 14px;">Casos prováveis acumulados — Regional</div>
    <div id="totalCasosRegional" style="font-size: 28px; font-weight: bold;">--</div>
</div>
    
    <div id="kpiTotal" style="
    display: inline-block;
    padding: 12px 20px;
    margin: 10px 0 20px 0;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
">
    <div style="font-size: 14px;">Casos prováveis acumulados</div>
    <div id="totalCasos" style="font-size: 28px; font-weight: bold;">--</div>
</div>

    <div id="kpiUltimaSE" style="
    display: inline-block;
    padding: 12px 20px;
    margin: 10px 0 20px 10px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
">
    <div style="font-size: 14px;">Casos na última SE</div>
    <div id="casosUltimaSE" style="font-size: 28px; font-weight: bold;">--</div>
</div>

    <div id="kpiQ3" style="
    display: inline-block;
    padding: 12px 20px;
    margin: 10px 0 20px 10px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
">
    <div style="font-size: 14px;">Municípios acima do Q3</div>
    <div id="municipiosAcimaQ3" style="font-size: 28px; font-weight: bold;">--</div>
</div>

    <p>
        Superintendência Regional de Saúde de Colatina
        — 2026
    </p>

</header>


<div class="container">

    <div class="filtro">

        <label for="municipio">
            Município:
        </label>

        <select id="municipio"></select>

    </div>


    <div class="grafico">

        <div id="grafico"></div>

    </div>

</div>


<script>

const arquivoCSV = "painel_dengue_regional_2026.csv";

let dados = [];


/* ------------------------------------------------
   LER O BANCO DE DADOS
------------------------------------------------ */

Papa.parse(arquivoCSV, {

    download: true,

    header: true,

    skipEmptyLines: true,

    complete: function(resultado) {

        dados = resultado.data;

        // Descobre automaticamente a última SE com casos informados
        const semanasComDados = dados
            .filter(d => d.Casos !== "" && d.Casos !== null && d.Casos !== undefined)
            .map(d => Number(d.SE))
            .filter(se => !isNaN(se));

        const ultimaSE = Math.max(...semanasComDados);

        // Mostra a informação no topo do painel
        document.getElementById("atualizacao").textContent =
            `Dados atualizados até a SE ${ultimaSE}/2026`;
        
        // Calcula o total acumulado de casos prováveis
const totalCasos = dados
    .filter(d => d.Casos !== "" && d.Casos !== null && d.Casos !== undefined)
    .reduce((soma, d) => soma + Number(d.Casos || 0), 0);

// Mostra o total no KPI
document.getElementById("totalCasos").textContent =
    totalCasos.toLocaleString("pt-BR");

       // Calcula o total de casos da última SE disponível
const casosUltimaSE = dados
    .filter(d =>
        Number(d.SE) === ultimaSE &&
        d.Casos !== "" &&
        d.Casos !== null &&
        d.Casos !== undefined
    )
    .reduce((soma, d) => soma + Number(d.Casos || 0), 0);

// Mostra o total da última SE no KPI
document.getElementById("casosUltimaSE").textContent =
    casosUltimaSE.toLocaleString("pt-BR"); 

        // Conta quantos municípios estão acima do Q3 na última SE
const municipiosAcimaQ3 = dados.filter(d =>
    Number(d.SE) === ultimaSE &&
    d.Casos !== "" &&
    d.Casos !== null &&
    d.Casos !== undefined &&
    d.Q3 !== "" &&
    d.Q3 !== null &&
    d.Q3 !== undefined &&
    Number(d.Casos) > Number(d.Q3)
).length;

// Mostra o resultado no KPI
document.getElementById("municipiosAcimaQ3").textContent =
    `${municipiosAcimaQ3} de 15`;

        
        prepararDados();

    }

});


/* ------------------------------------------------
   PREPARAR OS DADOS
------------------------------------------------ */

function prepararDados() {

    dados.forEach(d => {

        d.SE = Number(d.SE);

        d.Casos =
            d.Casos === "" ? null : Number(d.Casos);

        d.Mediana =
            d.Mediana === "" ? null : Number(d.Mediana);

        d.Q1 =
            d.Q1 === "" ? null : Number(d.Q1);

        d.Q3 =
            d.Q3 === "" ? null : Number(d.Q3);

    });


    const municipios = [

        ...new Set(
            dados.map(d => d.Municipio)
        )

    ].sort();


    const seletor =
        document.getElementById("municipio");


    municipios.forEach(municipio => {

        const opcao =
            document.createElement("option");

        opcao.value = municipio;

        opcao.textContent = municipio;

        seletor.appendChild(opcao);

    });


    seletor.addEventListener(
        "change",
        atualizarGrafico
    );


    atualizarGrafico();

}


/* ------------------------------------------------
   CRIAR O DIAGRAMA
------------------------------------------------ */

function atualizarGrafico() {

    const municipio =
        document.getElementById("municipio").value;


    const base = dados
        .filter(d => d.Municipio === municipio)
        .sort((a,b) => a.SE - b.SE);

    // Total acumulado de casos prováveis da Regional
const totalCasosRegional = dados
    .filter(d => d.Casos !== null)
    .reduce((soma, d) => soma + d.Casos, 0);

document.getElementById("totalCasosRegional").textContent =
    totalCasosRegional.toLocaleString("pt-BR");


    const semanas =
        base.map(d => d.SE);


    const casos =
        base.map(d => d.Casos);


    const mediana =
        base.map(d => d.Mediana);


    const q1 =
        base.map(d => d.Q1);


    const q3 =
        base.map(d => d.Q3);

    // ------------------------------------------------
// KPIs DO MUNICÍPIO SELECIONADO
// ------------------------------------------------

// Última SE disponível no painel
const ultimaSEPainel = Math.max(
    ...dados
        .filter(d => d.Casos !== null)
        .map(d => d.SE)
);

// Casos acumulados do município selecionado
const totalCasosMunicipio = base
    .filter(d => d.Casos !== null)
    .reduce((soma, d) => soma + d.Casos, 0);

// Casos do município na última SE disponível
const registroUltimaSE = base.find(
    d => d.SE === ultimaSEPainel
);

const casosUltimaSEMunicipio =
    registroUltimaSE &&
    registroUltimaSE.Casos !== null
        ? registroUltimaSE.Casos
        : 0;

// Atualiza os KPIs
document.getElementById("totalCasos").textContent =
    totalCasosMunicipio.toLocaleString("pt-BR");

document.getElementById("casosUltimaSE").textContent =
    casosUltimaSEMunicipio.toLocaleString("pt-BR");

// Identifica as semanas em que os casos ultrapassaram o Q3
const dadosAlerta = base.filter(d =>
    d.Casos !== null &&
    d.Q3 !== null &&
    d.Casos > d.Q3
);

const semanasAlerta =
    dadosAlerta.map(d => d.SE);

const casosAlerta =
    dadosAlerta.map(d => d.Casos);

    const linhaCasos = {

        x: semanas,

        y: casos,

        type: "scatter",

        mode: "lines+markers",

        name: "Casos 2026",

        line: {
            width: 3
        },

        marker: {
            size: 7
        }

    };

    const pontosAlerta = {

    x: semanasAlerta,

    y: casosAlerta,

    type: "scatter",

    mode: "markers",

    name: "Acima do Q3",

    marker: {
        size: 12,
        symbol: "diamond"
    },

    hovertemplate:
        "SE %{x}<br>Casos: %{y}<br>Acima do Q3<extra></extra>"

};

    const linhaMediana = {

        x: semanas,

        y: mediana,

        type: "scatter",

        mode: "lines",

        name: "Mediana",

        line: {
            width: 2,
            dash: "dash"
        }

    };


    const linhaQ1 = {

        x: semanas,

        y: q1,

        type: "scatter",

        mode: "lines",

        name: "Q1",

        line: {
            width: 1
        }

    };


    const linhaQ3 = {

        x: semanas,

        y: q3,

        type: "scatter",

        mode: "lines",

        name: "Q3",

        fill: "tonexty",

        line: {
            width: 1
        }

    };


    const layout = {

        title: {
            text:
            "Diagrama de Controle — " + municipio
        },

        xaxis: {

    title:
    "Semana Epidemiológica",

    tickmode: "linear",

    tick0: 1,

    dtick: 1,

    range: [1, 52],

    autorange: false

},

        yaxis: {

            title:
            "Número de casos",

            rangemode:
            "tozero"

        },

        hovermode:
        "x unified",

        legend: {

            orientation: "h",

            y: -0.2

        },

        margin: {

            l: 60,
            r: 30,
            t: 70,
            b: 100

        }

    };


    Plotly.newPlot(

        "grafico",

       [
    linhaQ1,
    linhaQ3,
    linhaMediana,
    linhaCasos,
    pontosAlerta
],

        layout,

        {
            responsive: true
        }

    );

}

</script>

</body>

</html>
